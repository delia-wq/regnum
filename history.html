<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGNUM — История</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="menu-toggle" id="menu-toggle">REGNUM</button>

    <aside class="side-nav" id="side-nav">
        <button class="side-close" id="side-close">&times;</button>
        <a href="index.html" class="side-link">Главная</a>
        <a href="history.html" class="side-link">История</a>
        <a href="patent.html" class="side-link">Патент</a>
        <a href="rules.html" class="side-link">Правила</a>
        <a href="chats.html" class="side-link">Чаты</a>
        <a href="contacts.html" class="side-link">Контакты</a>
        <a href="games.html" class="side-link">Игры</a>
    </aside>
    <div class="overlay" id="overlay"></div>

    <section class="history-hero">
        <h1 class="page-title">Наша история</h1>
        <p class="page-sub">Нажмите на артефакт, чтобы узнать его легенду</p>

        <!-- СЕТКА С 5 АРТЕФАКТАМИ -->
        <div class="photo-grid">
            
            <div class="photo-item" data-story="story1">
                <img src="images/photo2.jpg" alt="Золотая Печать">
                <span class="photo-caption">Золотая Печать</span>
            </div>

            <div class="photo-item" data-story="story2">
                <img src="images/photo3.jpg" alt="Венец Теней">
                <span class="photo-caption">Венец Теней</span>
            </div>

            <div class="photo-item" data-story="story3">
                <img src="images/photo4.jpg" alt="Часы Молчание">
                <span class="photo-caption">Часы «Молчание»</span>
            </div>

            <div class="photo-item" data-story="story4">
                <img src="images/photo5.jpg" alt="Ключ от Архива">
                <span class="photo-caption">Ключ от Архива</span>
            </div>

            <div class="photo-item" data-story="story5">
                <img src="images/photo6.jpg" alt="Компас Пустоты">
                <span class="photo-caption">Компас Пустоты</span>
            </div>

        </div>
    </section>

    <!-- МОДАЛЬНОЕ ОКНО ДЛЯ ИСТОРИЙ -->
    <div class="modal" id="story-modal">
        <div class="modal-box">
            <button class="modal-close">&times;</button>
            <h3 id="modal-title"></h3>
            <p id="modal-text"></p>
        </div>
    </div>

    <footer class="footer">
        <p>REGNUM © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
